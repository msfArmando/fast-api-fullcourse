[project]
name = "fast-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "msfArmando",email = "armandomonsaof@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pytz (>=2026.6,<2027.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ruff = "^0.16.7"
typos = "^1.50.1"
httpx2 = "^2.12.0"
pytest-random-order = "^1.2.0"
pytest-asyncio = "^1.5.0"
factory-boy = "^3.3.3"
freezegun = "^1.5.5"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=fast_zero', '--cov-context=test', '--cov-branch']
asyncio_default_fixture_loop_scope = 'function'

[tool.poe.tasks]
lint.sequence = [
  { cmd = "typos --write-changes" },
  { cmd = "ruff check" },
]
format.sequence = [
  { cmd = "ruff check --fix" },
  { cmd = "ruff format" },
]
serve = "fastapi dev fast_zero/app.py"
test.sequence = [
  { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
  { cmd = "coverage html --show-contexts" },
]
testreport = "poetry run coverage html --show-contexts"

[tool.poe]
poetry_command = ""
